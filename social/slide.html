<!doctype html>
<!-- One 1080x1350 carousel slide. social/agent.mjs fills in the double-brace placeholders below. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{background:#1d3a6e;color:#fff;font-family:Inter,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;padding:96px 92px 80px;box-sizing:border-box;position:relative}
body::after{content:"";position:absolute;right:-180px;top:-180px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(242,176,30,.28),rgba(242,176,30,0) 70%)}
.kicker{display:inline-block;align-self:flex-start;background:#f2b01e;color:#1d3a6e;font-weight:600;font-size:30px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:12px 26px}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:92px;line-height:1.04;margin:56px 0 0;letter-spacing:-.01em}
.body{font-size:44px;line-height:1.42;color:#dbe4f3;margin-top:48px;white-space:pre-line}
main{margin:auto 0;padding-bottom:40px}
.foot{display:flex;align-items:center;justify-content:space-between;font-size:32px;color:#c9d4e8}
.brand{display:flex;align-items:center;gap:18px;font-weight:600;color:#fff}
.brand img{width:72px;height:72px;border-radius:16px}
</style></head>
<body>
<main><span class="kicker">{{KICKER}}</span>
<h1>{{TITLE}}</h1>
<div class="body">{{BODY}}</div></main>
<div class="foot"><div class="brand"><img src="{{LOGO}}" alt="">essaywiz.app</div><div>{{PAGE}}</div></div>
</body></html>
