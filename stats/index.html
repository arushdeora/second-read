<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Owner stats – EssayWiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f5f9;--paper:#fff;--ink:#15233f;--muted:#5b6579;--line:#dde2ea;--soft:#f7f9fc;--accent:#1d3a6e;--bar:#2f6fd6;--good:#2b7a57;--bad:#b3362f;
  --display:"Source Serif 4",Georgia,serif;--body:"Source Sans 3",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.top{height:56px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.brand{font:700 1.3rem var(--display);color:var(--ink);text-decoration:none}
main{max-width:1040px;margin:0 auto;padding:22px 16px 48px}
h1{font:700 1.6rem var(--display);margin:0 0 4px}h2{font:700 1.1rem var(--display);margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.bar-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{font:600 .88rem var(--body);border:0;background:none;padding:7px 13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile .k{color:var(--muted);font-size:.85rem;font-weight:600}
.tile .v{font:700 1.65rem/1.2 var(--display);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.tile .n{color:var(--muted);font-size:.8rem}
.tile.pos .v{color:var(--good)}.tile.neg .v{color:var(--bad)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chart{position:relative}svg{display:block;width:100%;height:auto}
.grid line{stroke:var(--line)}.axis text{fill:var(--muted);font:12px var(--body)}
.tip{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;background:var(--ink);color:#fff;font-size:.82rem;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.chart{overflow:hidden}.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:.82rem;font-weight:600}
td.r,th.r{text-align:right}
.note{color:var(--muted);font-size:.85rem;margin:6px 0 0}
.msg{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
@media(max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/">EssayWiz</a><span class="sub" style="margin:0">Owner stats</span></header>
<main>
  <h1>Audience, revenue and cost</h1>
  <p class="sub" id="asof">Loading…</p>
  <div class="bar-row">
    <div class="seg" role="group" aria-label="Time range">
      <button data-days="7">7 days</button><button data-days="30" aria-pressed="true">30 days</button><button data-days="90">90 days</button>
    </div>
    <button class="seg" id="reload" style="padding:7px 13px;font:600 .88rem var(--body);cursor:pointer;color:var(--muted)">Refresh</button>
  </div>
  <div id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let days = 30, data = null, metric = "users";
const usd = (x, d = 2) => (x < 0 ? "−$" : "$") + Math.abs(x).toFixed(d);
const n = x => Number(x || 0).toLocaleString();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TOOL_NAMES = { analyze: "AI Detector / Essay Check", humanize: "Humanizer", plagiarism: "Plagiarism", review: "Grammar", rewrite: "Paraphraser", cite: "Citations", original: "Rewrite (original)" };

function token() {
  try {
    const t = localStorage.getItem("sr_tok"); if (!t) return null;
    const p = JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    return p.exp * 1000 > Date.now() + 30000 ? t : null;
  } catch { return null; }
}
function message(html) { $("out").innerHTML = `<div class="msg">${html}</div>`; $("asof").textContent = ""; }

async function load() {
  const t = token();
  if (!t) return message(`Sign in first. Open <a href="/">the main site</a>, sign in with your owner Google account, then come back to this page.`);
  $("asof").textContent = "Loading…";
  try {
    const r = await fetch("/api/stats", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + t }, body: JSON.stringify({ days }) });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) return message(`Your sign-in expired. Open <a href="/">the main site</a> to sign in again, then reload.`);
    if (r.status === 403) return message("This page is only for the site owner.");
    if (!r.ok) return message("Couldn't load stats (" + esc(d.code || r.status) + "). Try again in a minute.");
    if (d.code === "no_database") return message("Connect the Supabase database (SUPABASE_URL and SUPABASE_SECRET_KEY in Vercel) and run <code>supabase/schema.sql</code> to start tracking.");
    data = d; render();
  } catch (e) { message("Couldn't reach the server. Check your connection and refresh."); }
}

function tile(k, v, note, cls = "") { return `<div class="tile ${cls}"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${note}</div></div>`; }

function render() {
  const s = data.summary;
  $("asof").textContent = `Last ${data.days} days · updated ${new Date(data.generatedAt).toLocaleString()} · your own visits are not counted as users`;
  const profitCls = s.profit > 0 ? "pos" : s.profit < 0 ? "neg" : "";
  const conv = s.users ? (s.proActive / s.users * 100).toFixed(1) + "% of users" : "no users yet";
  $("out").innerHTML = `
    <div class="tiles">
      ${tile("Users", n(s.users), `${n(s.newUsers)} new · ${n(s.activeToday)} today`)}
      ${tile("Checks run", n(s.checks), `${n(s.words)} words · ${n(s.limitHits)} hit a free limit`)}
      ${tile("Pro members", n(s.proActive), `${conv} · ${n(s.proSignups)} sign-ups`)}
      ${tile("Revenue (after PayPal fees)", usd(s.net), data.billing ? `${usd(s.gross)} paid − ${usd(s.fees)} fees` : "PayPal not connected")}
      ${tile("Claude cost", usd(s.aiCost, s.aiCost < 1 ? 4 : 2), `${usd(s.costPerCheck, 4)} per check · ${usd(s.ownerAiCost, 4)} from your own tests`)}
      ${tile("Fixed costs", usd(s.fixed), s.fixedMonthly ? `${usd(s.fixedMonthly)}/month, prorated` : "set FIXED_MONTHLY_COSTS_USD")}
      ${tile("Profit", usd(s.profit), "revenue − Claude − fixed costs", profitCls)}
      ${tile("All-time users", n(s.totalUsers), "since tracking started")}
    </div>
    <div class="card">
      <div class="chart-head"><h2 id="chartTitle"></h2>
        <div class="seg" role="group" aria-label="Chart metric">
          <button data-m="users">Users</button><button data-m="checks">Checks</button><button data-m="cost">Claude cost</button><button data-m="revenue">Revenue</button>
        </div></div>
      <div class="chart" id="chart"></div>
    </div>
    <div class="card"><h2>By tool</h2><div class="tbl">${toolTable()}</div></div>
    <div class="card"><details><summary>Daily numbers (table)</summary><div class="tbl">${dailyTable()}</div></details>
      <p class="note">Claude cost is estimated from the tokens each request used and Anthropic's published prices; your Anthropic Console shows the exact bill. Revenue comes straight from PayPal. Numbers start from when tracking was switched on.</p></div>`;
  document.querySelectorAll("[data-m]").forEach(b => { b.setAttribute("aria-pressed", b.dataset.m === metric); b.onclick = () => { metric = b.dataset.m; render(); }; });
  drawChart();
}

function toolTable() {
  if (!data.tools.length) return `<p class="note">No checks yet in this period.</p>`;
  return `<table><thead><tr><th>Tool</th><th class="r">Checks</th><th class="r">Words</th><th class="r">Claude cost</th><th class="r">Cost per check</th></tr></thead><tbody>${
    data.tools.map(t => `<tr><td>${esc(TOOL_NAMES[t.tool] || t.tool)}</td><td class="r">${n(t.checks)}</td><td class="r">${n(t.words)}</td><td class="r">${usd(t.cost, 4)}</td><td class="r">${usd(t.avgCost, 4)}</td></tr>`).join("")}</tbody></table>`;
}
function dailyTable() {
  return `<table><thead><tr><th>Day</th><th class="r">Users</th><th class="r">New</th><th class="r">Checks</th><th class="r">Claude cost</th><th class="r">Revenue</th></tr></thead><tbody>${
    data.daily.slice().reverse().map(d => `<tr><td>${d.day}</td><td class="r">${n(d.users)}</td><td class="r">${n(d.newUsers)}</td><td class="r">${n(d.checks)}</td><td class="r">${usd(d.cost, 4)}</td><td class="r">${usd(d.revenue)}</td></tr>`).join("")}</tbody></table>`;
}

function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function drawChart() {
  const titles = { users: "Daily users", checks: "Checks per day", cost: "Claude cost per day (USD)", revenue: "Revenue per day (USD, after fees)" };
  $("chartTitle").textContent = titles[metric];
  const rows = data.daily, vals = rows.map(d => d[metric]);
  const money = metric === "cost" || metric === "revenue";
  const fmt = v => money ? usd(v, v < 1 && v > 0 ? 3 : 2) : n(v);
  const W = Math.max(320, Math.round($("chart").clientWidth || 960)), H = W < 600 ? 220 : 260, L = 48, R = 8, T = 10, B = 28, iw = W - L - R, ih = H - T - B;
  const max = niceMax(Math.max(...vals)), step = iw / rows.length, bw = Math.max(2, Math.min(28, step - 2));
  const y = v => T + ih - (v / max) * ih;
  let g = `<g class="grid">`; for (let i = 0; i <= 4; i++) { const v = max * i / 4; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`; } g += `</g><g class="axis">`;
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; g += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${money ? "$" + (+v.toFixed(3)) : +v.toFixed(1)}</text>`; }
  const every = Math.ceil(rows.length / 8);
  rows.forEach((d, i) => { if (i % every === 0 || (i === rows.length - 1 && i % every >= every / 2)) g += `<text x="${L + i * step + step / 2}" y="${H - 8}" text-anchor="middle">${d.day.slice(5)}</text>`; });
  g += `</g>`;
  let bars = "";
  rows.forEach((d, i) => {
    const v = d[metric], x = L + i * step + (step - bw) / 2, h = Math.max(0, (v / max) * ih), r = Math.min(4, bw / 2, h);
    if (h > 0) bars += `<path d="M${x},${T + ih} V${T + ih - h + r} Q${x},${T + ih - h} ${x + r},${T + ih - h} H${x + bw - r} Q${x + bw},${T + ih - h} ${x + bw},${T + ih - h + r} V${T + ih} Z" fill="var(--bar)"/>`;
    bars += `<rect x="${L + i * step}" y="${T}" width="${step}" height="${ih}" fill="transparent" data-i="${i}"/>`;
  });
  $("chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${titles[metric]}">${g}<line x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}" stroke="#c5ccd8"/>${bars}</svg><div class="tip" id="tip"></div>`;
  const svg = $("chart").querySelector("svg"), tip = $("tip");
  svg.querySelectorAll("rect[data-i]").forEach(el => {
    el.addEventListener("mousemove", e => {
      const d = rows[+el.dataset.i], box = $("chart").getBoundingClientRect();
      tip.textContent = `${d.day}: ${fmt(d[metric])}`; tip.style.left = (e.clientX - box.left) + "px"; tip.style.top = (e.clientY - box.top) + "px"; tip.style.opacity = 1; tip.style.visibility = "visible";
    });
    el.addEventListener("mouseleave", () => { tip.style.opacity = 0; tip.style.visibility = "hidden"; });
  });
}

document.querySelectorAll("[data-days]").forEach(b => b.onclick = () => {
  days = +b.dataset.days; document.querySelectorAll("[data-days]").forEach(x => x.setAttribute("aria-pressed", x === b)); load();
});
$("reload").onclick = load;
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => data && drawChart(), 150); });
load();
</script>
</body>
</html>
